on:
  workflow_dispatch:
    inputs:
      breakpoint:
        description: "Stop for debugging"
        required: false
        type: boolean
      run_on_ghrunners:
        description: "Also run on GitHub-hosted runners"
        required: false
        type: boolean

name: simple-macos

jobs:
  env:
    # strategy:
    #   matrix:
    #     release:
    #       - ""
    #       - "-sequoia"
    #       - "-tahoe"
    #   fail-fast: false

    runs-on:
      # - namespace-profile-macos${{matrix.release}}
      - nscloud-macos-sequoia-arm64-6x14-with-features
      - namespace-features:macos.select_xcode.min_version=16.2

    steps:
      - name: Env checks
        run: |
          xcode-select -p
          ls -l /Applications
          xcrun simctl list
      - name: Breakpoint
        if: inputs.breakpoint || failure() && github.ref_name == 'main'
        uses: namespacelabs/breakpoint-action@v0
        with:
          duration: 15m
          authorized-users: edganiukov,hugosantos,n-g,htr,nichtverstehen,gmichelo,attilaolah,pavolmarko

  ghrunners:
    runs-on: macos-15
    if: inputs.run_on_ghrunners
    steps:
      - name: Env checks
        run: |
          ulimit -a
          env
          uname -a
          xcrun simctl list
      - name: Breakpoint
        if: inputs.breakpoint || failure() && github.ref_name == 'main'
        uses: namespacelabs/breakpoint-action@v0
        with:
          duration: 15m
          authorized-users: edganiukov,hugosantos,n-g,htr,nichtverstehen,gmichelo,attilaolah,pavolmarko
